    <script>
      // Aplica tema e idioma antes do primeiro paint, para não piscar
      try {
        var raiz = document.documentElement;
        var tema = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        var idioma = localStorage.getItem("lang") || (navigator.language.toLowerCase().startsWith("pt") ? "pt" : "en");
        raiz.dataset.theme = tema;
        raiz.lang = idioma === "pt" ? "pt-BR" : "en";
      } catch (e) {}
    </script>

    <div id="root"></div>
